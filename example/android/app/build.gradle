apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Firebase credentials are not committed. Apply the Google Services plugin
// only when a local google-services.json is present, so the example builds
// without a Firebase project.
if (file('google-services.json').exists()) {
    apply plugin: "com.google.gms.google-services"
}

apply from: new File(rootProject.projectDir, 'react-node.gradle')

react {
    autolinkLibrariesWithApp()
    cliFile = file("../../../node_modules/react-native/cli.js")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    reactNativeDir = file("../../../node_modules/react-native")
    hermesCommand = file("../../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc").absolutePath
    nodeExecutableAndArgs.set([gradle.ext.resolveNodeBinary(rootProject.projectDir)])
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.altcraft.rn.app"

    defaultConfig {
        applicationId "com.altcraft.rn.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:33.4.0"))
    implementation("com.google.firebase:firebase-messaging")

    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
